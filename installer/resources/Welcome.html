  <h1>MK Crossfader</h1>
  <p>This package installs two independent tools for Maschine 3:</p>
  <ul>
    <li>MK MIDI Crossfader, a native macOS menu-bar app.</li>
    <li>MK Crossfader VST3, a self-contained Controller and Target plug-in.</li>
  </ul>
  <p>The VST3 does not require the app to be running.</p>
