name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    name: Public history privacy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Audit public history
        run: bash scripts/privacy-audit.sh

  macos-app:
    name: macOS app
    needs: privacy
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Run Swift tests
        run: swift test --package-path macos-app
      - name: Test source privacy preflight
        run: bash scripts/tests/privacy-preflight.sh
      - name: Test installer release preflight
        run: python3 scripts/tests/installer-preflight.py
      - name: Test installer container privacy
        run: python3 scripts/tests/installer-container.py
      - name: Check CI publication policy
        run: ruby scripts/tests/ci-policy.rb
      - name: Build app bundle
        run: ./macos-app/scripts/build-app.sh

  vst3:
    name: VST3 / macOS
    needs: privacy
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure
        run: cmake -S vst3 -B vst3/build-ci -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build vst3/build-ci --config Release --parallel 4
      - name: Test
        run: ctest --test-dir vst3/build-ci --output-on-failure --timeout 45

  vst3-windows:
    name: VST3 / Windows x64
    needs: privacy
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Test Windows build failure handling
        shell: pwsh
        run: ./vst3/tests/BuildWindowsTests.ps1
      - name: Configure
        run: cmake -S vst3 -B vst3/build-ci-windows -A x64
      - name: Build
        run: cmake --build vst3/build-ci-windows --config Release --parallel 4
      - name: Test
        run: ctest --test-dir vst3/build-ci-windows -C Release --output-on-failure --timeout 45
